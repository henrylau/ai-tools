name: Build and Push Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'mivolo/**'
      - 'yolo/**'
      - 'embedding/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: mivolo
          - service: yolo
          - service: embedding
          # The default embedding image is CPU-only — onnxruntime has no CUDA
          # support compiled in. This variant carries onnxruntime-gpu and the
          # CUDA libraries, and is published as :latest-gpu.
          - service: embedding
            variant: gpu
            build-args: ONNXRUNTIME_PACKAGE=onnxruntime-gpu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          flavor: |
            suffix=${{ matrix.variant && format('-{0}', matrix.variant) || '' }},onlatest=true
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          platforms: linux/amd64
          build-args: ${{ matrix.build-args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}${{ matrix.variant && format('-{0}', matrix.variant) || '' }}
